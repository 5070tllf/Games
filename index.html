<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>寻道 · 砍树修仙</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; -webkit-tap-highlight-color:transparent; }
body { background:#0a0a0f; color:#fff; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; position:relative; }
body::before { content:''; position:fixed; top:-50vh; left:-50vw; width:200vw; height:200vh; background:radial-gradient(circle at 20% 30%, rgba(100,200,255,0.3) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(255,100,200,0.3) 0%, transparent 40%); animation:spin 20s linear infinite; filter:blur(50px); z-index:-1; }
@keyframes spin { 100% { transform:rotate(360deg); } }
#loading { position:fixed; inset:0; background:#0a0a0f; display:flex; justify-content:center; align-items:center; flex-direction:column; z-index:99999; }
#loading .spinner { width:50px; height:50px; border:3px solid rgba(255,215,0,0.2); border-top-color:#ffd700; border-radius:50%; animation:spin2 1s linear infinite; }
@keyframes spin2 { 100% { transform:rotate(360deg); } }
#loading p { margin-top:20px; color:#ffd700; font-size:14px; text-align:center; padding:0 20px; }
#authScreen { position:fixed; inset:0; background:#0a0a0f; display:none; justify-content:center; align-items:center; padding:20px; z-index:99998; overflow-y:auto; }
.auth-box { background:rgba(30,30,30,0.8); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.15); padding:32px 24px; border-radius:24px; width:90%; max-width:360px; }
.auth-box h1 { color:#ffd700; text-align:center; margin-bottom:20px; font-size:24px; text-shadow:0 0 15px rgba(255,215,0,0.5); }
.auth-tabs { display:flex; gap:8px; margin-bottom:16px; }
.auth-tab { flex:1; padding:10px; border:none; border-radius:10px; background:rgba(255,255,255,0.05); color:#888; font-weight:700; cursor:pointer; font-size:14px; }
.auth-tab.active { background:rgba(255,215,0,0.2); color:#ffd700; border:1px solid rgba(255,215,0,0.4); }
.auth-box input { width:100%; padding:14px; border:1px solid rgba(255,255,255,0.15); border-radius:12px; background:rgba(0,0,0,0.5); color:#fff; outline:none; font-size:16px; margin-bottom:12px; }
.auth-box button.primary { width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg,#ffd700,#ff8c00); color:#000; font-weight:800; font-size:16px; cursor:pointer; margin-bottom:10px; }
.auth-box button.one-click { width:100%; padding:15px; border:none; border-radius:12px; background:rgba(0,198,255,0.15); color:#00c6ff; border:1px solid rgba(0,198,255,0.4); font-weight:800; font-size:16px; cursor:pointer; display:none; }
.auth-err { color:#ff3b30; text-align:center; font-size:13px; margin-top:10px; min-height:20px; }

.header { background:rgba(0,0,0,0.5); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.1); padding:10px 12px; flex-shrink:0; }
.header-row { display:flex; justify-content:space-between; align-items:center; }
.header-name { font-size:15px; font-weight:800; color:#ffd700; text-shadow:0 0 10px rgba(255,215,0,0.5); }
.header-realm { font-size:11px; color:#00c6ff; }
.header-currency { display:flex; gap:8px; font-size:12px; font-weight:bold; }
.currency-jade { color:#00e5ff; }
.currency-peach { color:#ff9500; }
.header-stats { display:flex; gap:10px; margin-top:6px; font-size:11px; color:#aaa; justify-content:space-between; }
.header-stats span { color:#fff; font-weight:bold; }
.exp-bar-wrap { margin-top:6px; height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
.exp-bar { height:100%; background:linear-gradient(90deg,#00c6ff,#ffd700); transition:width 0.3s; border-radius:3px; }

.main { flex:1; display:flex; overflow:hidden; position:relative; }
.page { display:none; flex-direction:column; flex:1; overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }
.page.active { display:flex; }
.tree-area { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; }
.tree-visual { font-size:120px; filter:drop-shadow(0 0 30px rgba(0,255,100,0.5)); animation:treeBreath 3s ease-in-out infinite; }
@keyframes treeBreath { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
.tree-level { font-size:22px; font-weight:900; color:#ffd700; margin-top:10px; text-shadow:0 0 15px rgba(255,215,0,0.6); }
.tree-hint { font-size:12px; color:#888; margin-top:6px; }
.chop-btn { margin-top:30px; padding:18px 50px; font-size:20px; font-weight:900; background:linear-gradient(135deg,#ff8c00,#ff3b30); color:#fff; border:none; border-radius:20px; cursor:pointer; box-shadow:0 10px 30px rgba(255,59,48,0.4); transition:transform 0.1s; }
.chop-btn:active { transform:scale(0.92); }
.chop-btn:disabled { opacity:0.4; cursor:not-allowed; background:linear-gradient(135deg,#555,#333); box-shadow:none; }
#floatBox { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.float-text { position:absolute; top:50%; font-size:22px; font-weight:900; color:#30d158; text-shadow:0 0 15px rgba(48,209,88,0.8); animation:floatUp 1.2s ease-out forwards; }
.drop-text { position:absolute; top:40%; font-size:15px; font-weight:bold; text-shadow:0 0 10px currentColor; animation:floatUp 1.5s ease-out forwards; left:50%; transform:translateX(-50%); }
@keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-100px); } }
.card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:14px; margin-bottom:12px; backdrop-filter:blur(10px); }
.card-title { font-size:14px; font-weight:800; color:#00c6ff; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
.eq-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.eq-slot { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:10px; position:relative; }
.eq-part { font-size:12px; color:#888; margin-bottom:4px; }
.eq-quality { font-size:13px; font-weight:800; margin-bottom:4px; }
.eq-stats { font-size:11px; color:#aaa; }
.inv-item { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px; margin-bottom:8px; }
.pet-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.pet-item { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px; text-align:center; font-size:13px; }
.map-item { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:16px; margin-bottom:12px; }
.map-btn { width:100%; padding:12px; margin-top:10px; background:linear-gradient(135deg,#00c6ff,#0072ff); color:#fff; border:none; border-radius:12px; font-weight:bold; font-size:15px; cursor:pointer; }
.map-btn:disabled { opacity:0.4; cursor:not-allowed; }
.big-btn { width:100%; padding:14px; margin-bottom:10px; border:none; border-radius:14px; font-weight:800; font-size:15px; cursor:pointer; display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:4px; }
.big-btn:disabled { opacity:0.4; cursor:not-allowed; }
.btn-gold { background:linear-gradient(135deg,#ffd700,#ff8c00); color:#000; }
.btn-purple { background:linear-gradient(135deg,#9c27b0,#673ab7); color:#fff; }
.btn-blue { background:linear-gradient(135deg,#00c6ff,#0072ff); color:#fff; }
.btn-jade { background:linear-gradient(135deg,#00e5ff,#0088ff); color:#fff; }
.btn-green { background:linear-gradient(135deg,#30d158,#28a745); color:#000; }
.btn-orange { background:linear-gradient(135deg,#ff9500,#ff5e00); color:#fff; }

.nav { display:flex; background:rgba(0,0,0,0.7); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.1); padding-bottom:env(safe-area-inset-bottom); flex-shrink:0; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.nav-btn { flex:1; padding:10px 0; background:none; border:none; color:#888; font-size:10px; font-weight:600; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; transition:0.2s; min-width:60px;}
.nav-btn .icon { font-size:20px; }
.nav-btn.active { color:#00c6ff; }
.nav-btn.active .icon { filter:drop-shadow(0 0 8px #00c6ff); }
.nav-btn .icon { font-size:20px; }

#toastBox { position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:99999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { background:rgba(30,30,30,0.95); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.15); padding:10px 18px; border-radius:12px; font-size:13px; font-weight:600; color:#fff; animation:toastIn 0.3s; box-shadow:0 8px 25px rgba(0,0,0,0.5); max-width:90vw; word-break:break-all; }
@keyframes toastIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
.countdown-bar { height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; margin-top:8px; }
.countdown-fill { height:100%; background:linear-gradient(90deg,#00c6ff,#30d158); transition:width 0.3s; border-radius:3px; }
.spell-item { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px; margin-bottom:10px; }
.spell-name { font-weight:800; color:#ffd700; font-size:14px; margin-bottom:4px; }
.battle-hp { height:24px; background:rgba(255,255,255,0.1); border-radius:12px; overflow:hidden; margin:6px 0; position:relative; }
.battle-hp-fill { height:100%; transition:width 0.2s; border-radius:12px; }
.battle-hp-text { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; font-size:12px; font-weight:bold; text-shadow:0 1px 2px #000; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p id="loadingText">正在连接天道...</p></div>

<div id="authScreen">
  <div class="auth-box">
    <h1>寻道 · 砍树修仙</h1>
    <button class="one-click" id="btnOneClick" onclick="doOneClickLogin()"></button>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">账号登录</button>
      <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</button>
    </div>
    <div id="loginForm">
      <input id="loginName" type="text" placeholder="玩家名 或 GAME-XXXX" autocomplete="off">
      <input id="loginPwd" type="password" placeholder="密码" autocomplete="off">
      <button class="primary" onclick="doLogin()">登录</button>
    </div>
    <div id="registerForm" style="display:none;">
      <input id="regName" type="text" placeholder="玩家名（唯一）" autocomplete="off">
      <input id="regPwd" type="password" placeholder="密码（至少4位）" autocomplete="off">
      <input id="regPwd2" type="password" placeholder="确认密码" autocomplete="off">
      <button class="primary" onclick="doRegister()">注册并开始</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<div id="app" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
  <div class="header">
    <div class="header-row">
      <div>
        <div class="header-name" id="headerName">无名道友</div>
        <div class="header-realm" id="headerRealm">炼气 1 层 · Lv.1</div>
      </div>
      <div style="display:flex; align-items:center;">
        <div class="header-currency">
          <span class="currency-jade">💎 <span id="headerJade">0</span></span>
          <span class="currency-peach">🍑 <span id="headerPeaches">0</span></span>
        </div>
      </div>
    </div>
    <div class="exp-bar-wrap"><div class="exp-bar" id="expBar" style="width:0%"></div></div>
    <div class="header-stats">
      <div>攻击 <span id="headerAtk">0</span></div>
      <div>气血 <span id="headerHp">0</span></div>
      <div>经验 <span id="headerExp">0/100</span></div>
    </div>
  </div>

  <div class="main">
    <div class="page active" id="page-chop">
      <div class="tree-area">
        <div class="tree-visual">🌳</div>
        <div class="tree-level">仙树 Lv.<span id="treeLevelDisplay">1</span></div>
        <div class="tree-hint" id="treeLevelHint"></div>
        <div id="treeCountdown" style="display:none; width:80%; margin-top:12px;">
          <div style="font-size:12px;color:#00c6ff;text-align:center;margin-bottom:4px;">培育中... <span id="treeCountdownText"></span></div>
          <div class="countdown-bar"><div class="countdown-fill" id="treeCountdownFill" style="width:0%"></div></div>
        </div>
        <button class="chop-btn" id="chopBtn" onclick="chopTree()">🪓 砍树（消耗1仙桃）</button>
      </div>
      <div id="floatBox"></div>
    </div>

    <div class="page" id="page-equip">
      <div class="card">
        <div class="card-title">当前装备</div>
        <div class="eq-grid" id="equipmentList"></div>
      </div>
      <div class="card">
        <div class="card-title">
          <span>背包 (<span id="invCount">0</span>/500)</span>
          <div style="display:flex; gap:6px;">
            <button onclick="batchDecompose()" style="padding:4px 8px; background:rgba(255,149,0,0.2); color:#ff9500; border:1px solid rgba(255,149,0,0.4); border-radius:6px; font-size:11px; cursor:pointer;">🗑️ 一键分解</button>
            <button onclick="batchSmelt()" style="padding:4px 8px; background:rgba(0,198,255,0.2); color:#00c6ff; border:1px solid rgba(0,198,255,0.4); border-radius:6px; font-size:11px; cursor:pointer;">🔥 一键熔炼</button>
          </div>
        </div>
        <div id="inventoryList"></div>
      </div>
      <div class="card">
        <div class="card-title">灵兽与精怪</div>
        <div class="pet-grid" id="petList"></div>
        <div class="pet-grid" id="spiritList" style="margin-top:8px;"></div>
      </div>
    </div>

    <div class="page" id="page-map">
      <div class="map-item">
        <div style="font-size:16px;font-weight:800;color:#ff3b30;">⚔️ 妖王洞</div>
        <div style="font-size:12px;color:#aaa;">次数：<span id="demonKingTickets">10</span> | 进度：<span id="demonKingProgress">0 / 10</span></div>
        <div id="demonKingBattle" style="display:none;margin-top:12px;"></div>
        <button class="map-btn" id="demonKingBtn" onclick="challengeDemonKing()">挑战妖王</button>
      </div>
      <div class="map-item">
        <div style="font-size:16px;font-weight:800;color:#ff00ff;">🗼 镇妖塔</div>
        <div style="font-size:12px;color:#aaa;">次数：<span id="towerTickets">10</span> | 进度：<span id="towerProgress">0 / 50</span></div>
        <div id="towerBattle" style="display:none;margin-top:12px;"></div>
        <button class="map-btn" style="background:linear-gradient(135deg,#ff00ff,#7928ca);" id="towerBtn" onclick="challengeTower()">挑战塔层</button>
      </div>
      <div class="map-item">
        <div style="font-size:16px;font-weight:800;color:#00e5ff;">🏛️ 上古遗迹</div>
        <div style="font-size:12px;color:#aaa;">消耗 5 仙玉，必定掉落极品装备。</div>
        <button class="map-btn" style="background:linear-gradient(135deg,#00e5ff,#0088ff);" onclick="exploreRuins()">探索遗迹</button>
      </div>
    </div>

    <div class="page" id="page-cultivate">
      <div class="card">
        <div class="card-title">境界与轮回</div>
        <div style="font-size:14px;margin-bottom:10px;">境界：<span id="realmDisplay" style="color:#ffd700;"></span></div>
        <button class="big-btn btn-blue" onclick="trainRealm()">🧘 修炼</button>
        <button class="big-btn btn-purple" id="breakthroughBtn" onclick="breakthrough()">⚡ 渡劫突破</button>
        <button class="big-btn btn-orange" style="margin-top:10px;" onclick="doReincarnate()">☯️ 轮回转生</button>
        <button class="big-btn btn-gold" onclick="buyExtraDrop()">🪓 消耗天赋点：额外掉落</button>
        <div style="font-size:12px;color:#ffd700;margin-top:5px;text-align:center;">当前额外掉落件数：+<span id="extraDropDisplay">0</span></div>
      </div>
      <div class="card">
        <div class="card-title">仙树与仙术</div>
        <button class="big-btn btn-gold" id="upgradeTreeBtn" onclick="upgradeTree()">升级仙树</button>
        <div id="spellList" style="margin-top:10px;"></div>
      </div>
    </div>
    
    <div class="page" id="page-shop">
      <div class="card">
        <div class="card-title">🎁 特惠抢购礼包</div>
        <div id="giftList" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
      <div class="card">
        <div class="card-title">💎 仙玉专属商城</div>
        <button class="big-btn btn-jade" onclick="buyJadeItem('hourglass')">⏳ 时光沙漏 (1仙玉)</button>
        <button class="big-btn btn-jade" onclick="buyJadeItem('ticket')">🎫 副本挑战令 (3仙玉)</button>
      </div>
    </div>

    <div class="page" id="page-sect">
      <div class="card">
        <div class="card-title">🏯 宗门系统</div>
        <div id="sectInfo" style="font-size:13px;color:#aaa;margin-bottom:10px;"></div>
        <button class="big-btn btn-gold" onclick="createSect()" id="btnCreateSect">创建宗门 (100仙玉)</button>
        <button class="big-btn btn-green" onclick="donateSect()" id="btnDonateSect" style="display:none;">宗门捐献 (1000仙桃换10贡献)</button>
      </div>
    </div>

    <!-- 独立主页 -->
    <div class="page" id="page-home">
      <div class="card" style="text-align:center;">
        <div style="font-size:24px;font-weight:900;color:#fff;" id="profName">名字</div>
        <div style="font-size:12px;color:#aaa;margin-top:4px;" id="profId">ID</div>
        <div style="font-size:12px;color:#ffd700;margin-top:4px;" id="profReincarnate">轮回 0 次</div>
      </div>
    </div>

    <!-- 排行榜 -->
    <div class="page" id="page-rank">
      <div class="card">
        <div class="rank-tab" style="display:flex; gap:5px; margin-bottom:10px;">
          <button class="active" onclick="switchRankTab('power', this)">战力榜</button>
          <button onclick="switchRankTab('level', this)">等级榜</button>
        </div>
        <div class="rank-list" id="rankList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>

    <!-- 好友 -->
    <div class="page" id="page-friend">
      <div class="card">
        <div class="card-title">我的好友</div>
        <div id="friendList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- 底部导航 8 个 Tab -->
  <div class="nav">
    <button class="nav-btn active" data-page="chop" onclick="switchPage('chop')"><span class="icon">🪓</span>砍树</button>
    <button class="nav-btn" data-page="equip" onclick="switchPage('equip')"><span class="icon">⚔️</span>装备</button>
    <button class="nav-btn" data-page="map" onclick="switchPage('map')"><span class="icon">🗺️</span>秘境</button>
    <button class="nav-btn" data-page="cultivate" onclick="switchPage('cultivate')"><span class="icon">🧘</span>养成</button>
    <button class="nav-btn" data-page="shop" onclick="switchPage('shop')"><span class="icon">🛒</span>商城</button>
    <button class="nav-btn" data-page="sect" onclick="switchPage('sect')"><span class="icon">🏯</span>宗门</button>
    <button class="nav-btn" data-page="rank" onclick="switchPage('rank')"><span class="icon">🏆</span>排行</button>
    <button class="nav-btn" data-page="friend" onclick="switchPage('friend')"><span class="icon">💬</span>好友</button>
    <button class="nav-btn" data-page="home" onclick="switchPage('home')"><span class="icon">👤</span>我的</button>
  </div>
</div>

<div id="toastBox"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };

let db = null;
let state = null;
let playerRef = null;
let tickTimer = null;
let allOnlinePlayers = {};
let globalStateListener = null;
let globalGifts = [];
let playerId = localStorage.getItem('game_player_id');
let playerName = localStorage.getItem('game_player_name') || '';
let isCreatingSect = false; // 防连点锁

const MAX_SAFE = 1.7e308;
function safeNum(v, fallback) { return (typeof v !== 'number' || !isFinite(v) || isNaN(v)) ? (fallback || 0) : v; }
function safeAdd(a, b) { const r = safeNum(a, 0) + safeNum(b, 0); return !isFinite(r) ? MAX_SAFE : r; }
function safeMul(a, b) { const r = safeNum(a, 0) * safeNum(b, 0); return !isFinite(r) ? MAX_SAFE : r; }
function safeClampInf(v) { return (typeof v !== 'number' || isNaN(v)) ? 0 : (v === Infinity ? MAX_SAFE : (v === -Infinity ? 0 : v)); }

function getQualityWeights(treeLevel) { treeLevel = safeNum(treeLevel, 1); let maxQ = Math.min(66, Math.floor(treeLevel / 5)); let w = new Array(67).fill(0); if (maxQ === 0) maxQ = 1; for (let i = 0; i <= maxQ; i++) w[i] = Math.max(1, 50 - Math.abs(i - maxQ) * 5); return w; }
function rollQuality(treeLevel) { const w = getQualityWeights(treeLevel); const total = w.reduce((a,b)=>a+b,0); let r = Math.random() * total; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; } return 0; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function genEquipment(treeLevel) { treeLevel = safeNum(treeLevel, 1); const part = PART_KEYS[randInt(0, PART_KEYS.length - 1)]; const quality = rollQuality(treeLevel); const mult = QUALITY_MULT[quality] || 1; const base = safeMul(5 + treeLevel * 2, mult); return { id: 'EQ-' + Date.now() + '-' + randInt(1000,9999), part, quality, atk: Math.round(safeMul(base, 0.8 + Math.random()*0.4)), hp: Math.round(safeMul(base, (0.8 + Math.random()*0.4) * 2)), critRate: quality >= 4 ? +(Math.random()*0.03).toFixed(3) : 0, critDmg: quality >= 4 ? +(Math.random()*0.3).toFixed(2) : 0, enhance: 0 }; }

function treeUpgradeCost(level) { level = safeNum(level, 1); let r = 10 * Math.pow(1.35, level - 1); if (!isFinite(r)) r = MAX_SAFE; return Math.max(10, Math.round(r)); }
function treeUpgradeTime(level) { level = safeNum(level, 1); let sec = 30 * Math.pow(1.2, level - 1); if (!isFinite(sec)) sec = 86400; return safeClampInf(sec) * 1000; }
function spellUpgradeCost(level) { level = safeNum(level, 1); let r = 20 * Math.pow(1.25, level - 1); if (!isFinite(r)) r = MAX_SAFE; return Math.max(20, Math.round(r)); }

function getSpellData(spellId) { if (!state.spells[spellId]) state.spells[spellId] = { level: 1, upgradeEnd: 0 }; return state.spells[spellId]; }

function calcStats() {
  if (!state) return { atk:0, hp:0, critRate:0, critDmg:1.5, luck:0, totalPower:0 };
  let reincMult = Math.pow(2, safeNum(state.reincarnateCount, 0));
  let atk = safeAdd(state.atk, safeMul(safeNum(state.charLevel,1) - 1, 5));
  let hp = safeAdd(state.hp, safeMul(safeNum(state.charLevel,1) - 1, 20));
  let critRate = safeNum(state.critRate, 0); let critDmg = safeNum(state.critDmg, 1.5); let luck = safeNum(state.luck, 0);
  for (let p of PART_KEYS) { const eq = state.equipment[p]; if (eq) { const enhMult = 1 + safeNum(eq.enhance, 0) * 0.1; atk = safeAdd(atk, Math.round(safeMul(safeNum(eq.atk, 0), enhMult))); hp = safeAdd(hp, Math.round(safeMul(safeNum(eq.hp, 0), enhMult))); critRate = safeAdd(critRate, safeNum(eq.critRate, 0)); critDmg = safeAdd(critDmg, safeNum(eq.critDmg, 0)); } }
  if (state.pets.equipped !== null) { const idx = state.pets.owned.indexOf(state.pets.equipped); if (idx >= 0 && idx < PET_ATK.length) atk = safeAdd(atk, PET_ATK[idx]); }
  if (state.spirits.equipped !== null) { const idx = state.spirits.owned.indexOf(state.spirits.equipped); if (idx >= 0 && idx < SPIRIT_HP.length) hp = safeAdd(hp, SPIRIT_HP[idx]); }
  atk = safeAdd(atk, safeAdd(safeMul(safeNum(state.realm,0), 200), safeMul(safeNum(state.realmLevel,1), 20)));
  hp = safeAdd(hp, safeAdd(safeMul(safeNum(state.realm,0), 1000), safeMul(safeNum(state.realmLevel,1), 100)));
  for (let sp of SPELL_DEFS) { const d = state.spells[sp.id]; if (!d) continue; const val = safeMul(safeNum(d.level, 1), sp.per); if (sp.stat === 'atk') atk = safeAdd(atk, val); else if (sp.stat === 'hp') hp = safeAdd(hp, val); else if (sp.stat === 'critRate') critRate = safeAdd(critRate, val); else if (sp.stat === 'critDmg') critDmg = safeAdd(critDmg, val); else if (sp.stat === 'luck') luck = safeAdd(luck, val); }

}

// ===== 初始化 =====
async function boot() {
  const timeoutId = setTimeout(() => {
    const l = document.getElementById('loadingText');
    if (l && l.innerText === '正在连接天道...') {
      l.innerHTML = `<div style="color:#ff3b30;text-align:center;padding:20px;">
        <h3>⚠️ 连接超时</h3><p style="font-size:12px;margin-top:10px;">请检查网络或尝试更换浏览器</p>
        <button onclick="location.reload()" style="margin-top:15px;padding:10px 20px;background:#ff3b30;color:#fff;border:none;border-radius:8px;font-weight:bold;">刷新重试</button></div>`;
    }
  }, 5000);

  try {
    const app2 = initializeApp(firebaseConfig); db = getDatabase(app2);
    document.getElementById('loading').style.display = 'none';
    checkOneClickBtn();

    if (playerId && playerName) {
      const existAcc = await get(ref(db, 'game_accounts/' + playerName));
      if (existAcc.exists() && existAcc.val().playerId === playerId) {
        document.getElementById('app').style.display = 'flex';
        const ok = await loadPlayer();
        if (!ok) { localStorage.removeItem('game_player_id'); localStorage.removeItem('game_player_name'); document.getElementById('app').style.display = 'none'; document.getElementById('authScreen').style.display = 'flex'; checkOneClickBtn(); }
        clearTimeout(timeoutId);
        return;
      }
    }
    document.getElementById('authScreen').style.display = 'flex';
    clearTimeout(timeoutId);
  } catch (e) {
    clearTimeout(timeoutId);
    document.getElementById('loading').innerHTML = `<div style="color:#ff3b30;text-align:center;padding:20px;"><h2>初始化失败</h2><p style="margin-top:10px;font-size:13px;color:#aaa;word-break:break-all;">${e.message||e}</p><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#ff3b30;color:#fff;border:none;border-radius:10px;font-weight:bold;">重试</button></div>`;
  }
}

async function loadPlayer() {
  try {
    playerRef = ref(db, 'game_players/' + playerId);
    const banSnap = await get(ref(db, 'game_config/banned_players/' + playerId));
    if (banSnap.exists()) { showBanScreen(banSnap.val()); return false; }
    const snap = await get(playerRef);
    if (snap.exists()) {
      state = snap.val();
      if (!state.equipment) state.equipment = freshState(playerName).equipment;
      if (!state.pets) state.pets = { owned: [], equipped: null };
      if (!state.spirits) state.spirits = { owned: [], equipped: null };
      if (!state.inventory) state.inventory = [];
      if (!state.spells) state.spells = {};
      if (!state.boughtGifts) state.boughtGifts = [];
      if (!state.friends) state.friends = [];
      if (state.jade === undefined) state.jade = 0;
      if (state.peaches === undefined) state.peaches = 0;
    } else { state = freshState(playerName); await set(playerRef, state); }
    
    if (globalStateListener) globalStateListener();
    globalStateListener = onValue(playerRef, (s) => { if (s.exists()) { const cloudState = s.val(); if (JSON.stringify(state) !== JSON.stringify(cloudState)) { state = cloudState; renderAll(); } } });
    
    onValue(ref(db, 'game_gifts'), (s) => {
      globalGifts = [];
      if (s.exists()) { const val = s.val(); for (let k in val) globalGifts.push({ id: k, ...val[k] }); }
      renderGifts();
    });
    
    onValue(ref(db, 'game_players/' + playerId + '/inbox'), (s) => { if (!s.exists()) return; const inbox = s.val(); for (let key in inbox) { const item = inbox[key]; if (!item.claimed) claimInboxItem(key, item); } });
    onValue(ref(db, 'game_config/banned_players/' + playerId), (s) => { if (s.exists()) showBanScreen(s.val()); });
    onValue(ref(db, 'game_players'), (s) => { if (s.exists()) { allOnlinePlayers = s.val(); for (let k in allOnlinePlayers) { const p = allOnlinePlayers[k]; allOnlinePlayers[k].playerId = k; let baseP = (p.atk||0) + (p.hp||0)*0.5 + (p.realm||0)*200; allOnlinePlayers[k].totalPower = baseP * Math.pow(2, p.reincarnateCount||0); } } });
    
    renderAll(); startTick(); return true;
  } catch (e) { authErr('读取存档失败: ' + e.message); return false; }
}

  document.getElementById('headerRealm').innerText = (REALM_NAMES[state.realm] || '未知') + ' ' + state.realmLevel + ' 层 · 轮回' + (state.reincarnateCount||0);
  document.getElementById('headerJade').innerText = fmt(state.jade); document.getElementById('headerPeaches').innerText = fmt(state.peaches); document.getElementById('headerAtk').innerText = fmt(stats.atk); document.getElementById('headerHp').innerText = fmt(stats.hp);

    const isBought = (state.boughtGifts||[]).includes(g.id);
    const div = document.createElement('div');
    div.style.cssText = `background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.3); border-radius:12px; padding:10px; opacity:${isBought?0.5:1};`;

async function autoBattle(enemyAtk, enemyHp, containerId) {
  const stats = calcStats(); let myHp = safeNum(stats.hp, 1); let eHp = safeNum(enemyHp, 1); let rounds = 0;
  const container = document.getElementById(containerId); container.style.display = 'block';
  container.innerHTML = `<div style="font-size:12px;color:#30d158;">我方 HP ${fmt(myHp)}</div><div class="battle-hp"><div class="battle-hp-fill" id="myHpBar" style="width:100%;background:linear-gradient(90deg,#30d158,#00c6ff);"></div><div class="battle-hp-text" id="myHpText">${fmt(myHp)}</div></div><div style="font-size:12px;color:#ff3b30;">敌方 HP ${fmt(eHp)}</div><div class="battle-hp"><div class="battle-hp-fill" id="enemyHpBar" style="width:100%;background:linear-gradient(90deg,#ff3b30,#ff8c00);"></div><div class="battle-hp-text" id="enemyHpText">${fmt(eHp)}</div></div>`;
  const myBar = document.getElementById('myHpBar'); const eBar = document.getElementById('enemyHpBar'); const myTxt = document.getElementById('myHpText'); const eTxt = document.getElementById('enemyHpText');
  const myMaxHp = myHp; const eMaxHp = eHp;
  while (myHp > 0 && eHp > 0 && rounds < 100) {
    rounds++; let dmg = safeNum(stats.atk, 1); if (Math.random() < stats.critRate) dmg = safeMul(dmg, stats.critDmg); eHp = safeAdd(eHp, -dmg); if (eHp > 0) myHp = safeAdd(myHp, -enemyAtk);
    myBar.style.width = Math.max(0, Math.min(100, (myHp / myMaxHp) * 100)) + '%'; eBar.style.width = Math.max(0, Math.min(100, (eHp / eMaxHp) * 100)) + '%'; myTxt.innerText = fmt(Math.max(0, myHp)); eTxt.innerText = fmt(Math.max(0, eHp));
    if (!isFinite(myHp)) myHp = 0; if (!isFinite(eHp)) eHp = 0; await new Promise(r => setTimeout(r, 60));
  }
  return { win: eHp <= 0 };
}
window.challengeDemonKing = async function() { if ((state.demonTickets||0) <= 0) return toast('次数不足'); const level = state.demonKingLevel + 1; if (level > 10) return toast('已通关'); const enemyHp = safeMul(200, Math.pow(1.5, level)); const enemyAtk = safeMul(15, Math.pow(1.4, level)); state.demonTickets = safeAdd(state.demonTickets, -1); document.getElementById('demonKingBtn').disabled = true; const result = await autoBattle(enemyAtk, enemyHp, 'demonKingBattle'); if (result.win) { state.demonKingLevel = level; const reward = randInt(20, 40) * level; state.peaches = safeAdd(state.peaches, reward); toast(`🏆 通关！仙桃+${fmt(reward)}`); } else toast('💀 失败'); document.getElementById('demonKingBtn').disabled = false; document.getElementById('demonKingBattle').style.display = 'none'; renderAll(); await saveState(); };

function checkLevelUp() { let need = safeMul(100, Math.pow(1.15, safeNum(state.charLevel,1)-1)); let levelsGained = 0; while (state.exp >= need) { state.exp = safeAdd(state.exp, -need); state.charLevel = safeAdd(state.charLevel, 1); need = safeMul(100, Math.pow(1.15, state.charLevel-1)); levelsGained++; if (levelsGained >= 10000) break; } if (levelsGained > 0) toast(`🎉 连升 ${fmt(levelsGained)} 级！当前 Lv.${fmt(state.charLevel)}`); }
function startTick() { if (tickTimer) clearInterval(tickTimer); tickTimer = setInterval(async () => { if (!state) return; let changed = false; if (state.treeUpgradeEnd > 0 && state.treeUpgradeEnd <= Date.now()) { state.treeLevel = safeAdd(state.treeLevel, 1); state.treeUpgradeEnd = 0; toast(`🌳 仙树 Lv.${fmt(state.treeLevel)}`); changed = true; } for (let sp of SPELL_DEFS) { const d = state.spells[sp.id]; if (d && d.upgradeEnd > 0 && d.upgradeEnd <= Date.now()) { d.level = safeAdd(d.level, 1); d.upgradeEnd = 0; toast(`📖 ${sp.name} Lv.${fmt(d.level)}`); changed = true; } } if (changed) { renderAll(); await saveState(); } }, 1000); }
function formatTime(ms) { if (ms <= 0) return '0秒'; const s = Math.ceil(ms / 1000); if (s < 60) return s + '秒'; const m = Math.floor(s / 60); if (m < 60) return m + '分' + (s%60) + '秒'; const h = Math.floor(m / 60); return h + '时' + (m%60) + '分'; }

window.switchPage = function(page) { ['chop','equip','map','cultivate','shop','sect','rank','friend','home'].forEach(p => { const el = document.getElementById('page-' + p); if (el) el.style.display = 'none'; }); const target = document.getElementById('page-' + page); if (target) target.style.display = 'flex'; document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); const navBtn = document.querySelector(`.nav-btn[data-page="${page}"]`); if (navBtn) navBtn.classList.add('active');

  if(page === 'friend') renderFriends();
  if(page === 'home') renderHome();
};

// ===== 账号与网络 =====
async function saveState() { if (!playerRef || !state) return; state.lastActive = Date.now(); try { await update(playerRef, state); } catch(e) { console.log('save error', e); } }
function claimInboxItem(key, item) { const { type, payload } = item; if (type === 'peaches') { state.peaches = safeAdd(state.peaches, safeNum(payload.amount,0)); toast(`📦 获得仙桃 +${fmt(payload.amount)}`); } else if (type === 'jade') { state.jade = safeAdd(state.jade, safeNum(payload.amount,0)); toast(`📦 获得仙玉 +${fmt(payload.amount)}`); } else if (type === 'talentPoints') { state.talentPoints = safeAdd(state.talentPoints, safeNum(payload.amount,0)); toast(`📦 获得天赋点 +${fmt(payload.amount)}`); } else if (type === 'sectPoints') { state.sectPoints = safeAdd(state.sectPoints, safeNum(payload.amount,0)); toast(`📦 获得宗门贡献 +${fmt(payload.amount)}`); } else if (type === 'equipment') { if (payload.equipment) { if (state.inventory.length >= 500) { state.inventory.sort((a,b) => a.quality - b.quality); const removed = state.inventory.shift(); state.peaches = safeAdd(state.peaches, Math.round(safeMul(safeAdd(removed.atk, removed.hp), safeMul(0.5, removed.quality+1)))); toast(`⚠️ 背包已满，自动分解了1件装备`); } state.inventory.push(payload.equipment); toast(`📦 获得装备`); } } update(ref(db, `game_players/${playerId}/inbox/${key}`), { claimed: true }).catch(()=>{}); saveState(); renderAll(); }
window.switchAuthTab = function(mode) { document.getElementById('tabLogin').classList.toggle('active', mode==='login'); document.getElementById('tabRegister').classList.toggle('active', mode==='register'); document.getElementById('loginForm').style.display = mode==='login' ? 'block' : 'none'; document.getElementById('registerForm').style.display = mode==='register' ? 'block' : 'none'; document.getElementById('authErr').innerText = ''; };
function authErr(msg) { document.getElementById('authErr').innerText = msg; }
function checkOneClickBtn() { const btn = document.getElementById('btnOneClick'); if (playerId && playerName) { btn.style.display = 'block'; btn.innerText = `一键登录 (${playerName})`; } else btn.style.display = 'none'; }
window.doOneClickLogin = async function() { if (!playerId || !playerName) return; document.getElementById('loading').style.display = 'flex'; document.getElementById('loadingText').innerText = '正在读取存档...'; document.getElementById('authScreen').style.display = 'none'; const ok = await loadPlayer(); document.getElementById('loading').style.display = 'none'; if (ok) document.getElementById('app').style.display = 'flex'; else document.getElementById('authScreen').style.display = 'flex'; };
window.doRegister = async function() { try { const name = document.getElementById('regName').value.trim(); const pwd = document.getElementById('regPwd').value; const pwd2 = document.getElementById('regPwd2').value; if (!name || name.length < 2) return authErr('玩家名至少2字符'); if (name.length > 12) return authErr('玩家名最多12字符'); if (!pwd || pwd.length < 4) return authErr('密码至少4位'); if (pwd !== pwd2) return authErr('两次密码不一致'); document.getElementById('loading').style.display = 'flex'; document.getElementById('loadingText').innerText = '正在注册...'; const exist = await get(ref(db, 'game_accounts/' + name)); if (exist.exists()) { document.getElementById('loading').style.display = 'none'; return authErr('该玩家名已被占用'); } const newId = genPlayerId(); await set(ref(db, 'game_accounts/' + name), { name, password: btoa(pwd), playerId: newId, createdAt: Date.now() }); await set(ref(db, 'game_players/' + newId), freshState(name)); localStorage.setItem('game_player_id', newId); localStorage.setItem('game_player_name', name); playerId = newId; playerName = name; await afterLogin(); } catch (e) { document.getElementById('loading').style.display = 'none'; authErr('注册失败: ' + e.message); } };
window.doLogin = async function() { try { const input = document.getElementById('loginName').value.trim(); const pwd = document.getElementById('loginPwd').value; if (!input || !pwd) return authErr('请输入账号和密码'); document.getElementById('loading').style.display = 'flex'; document.getElementById('loadingText').innerText = '正在登录...'; let accountData = null; const byName = await get(ref(db, 'game_accounts/' + input)); if (byName.exists()) accountData = byName.val(); else { const all = await get(ref(db, 'game_accounts')); if (all.exists()) { const accs = all.val(); for (let name in accs) { if (accs[name].playerId === input) { accountData = accs[name]; break; } } } } if (!accountData) { document.getElementById('loading').style.display = 'none'; return authErr('账号不存在'); } if (accountData.password !== btoa(pwd)) { document.getElementById('loading').style.display = 'none'; return authErr('密码错误'); } localStorage.setItem('game_player_id', accountData.playerId); localStorage.setItem('game_player_name', accountData.name); playerId = accountData.playerId; playerName = accountData.name; await afterLogin(); } catch (e) { document.getElementById('loading').style.display = 'none'; authErr('登录失败: ' + e.message); } };
async function afterLogin() { document.getElementById('authScreen').style.display = 'none'; const ok = await loadPlayer(); document.getElementById('loading').style.display = 'none'; if (ok) document.getElementById('app').style.display = 'flex'; else document.getElementById('authScreen').style.display = 'flex'; }

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
